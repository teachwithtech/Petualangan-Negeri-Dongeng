<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petualangan di Negeri Dongeng</title>
  <!-- Font Ceria khas Anak-anak -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --sky-blue: #70d6ff;
      --pink-bubble: #ff70a6;
      --orange-sun: #ff9770;
      --yellow-butter: #ffd670;
      --mint-green: #a8ffb2;
      --purple-candy: #e0aaff;
      --card-bg: #ffffff;
      --text-color: #2b2d42;
    }

    * {
      box-sizing: border-box;
      font-family: 'Fredoka', 'Segoe UI', cursive, sans-serif;
    }

    body {
      background-color: var(--sky-blue);
      /* Latar Awan & Cerita */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 20%);
      margin: 0;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-color);
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: 28px;
      border: 5px solid #2b2d42;
      box-shadow: 0 12px 0px #2b2d42;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .screen { display: none; }
    .active { display: block; }

    /* Header & Judul Game */
    h1, h2, h3 {
      text-align: center;
      margin-top: 0;
      color: #2b2d42;
      text-shadow: 2px 2px 0px #fff;
    }

    .game-title {
      font-size: 32px;
      color: var(--pink-bubble);
      -webkit-text-stroke: 1.5px #2b2d42;
      text-shadow: 3px 3px 0px var(--yellow-butter);
      margin-bottom: 20px;
    }

    /* Input & Labels */
    label {
      font-size: 18px;
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 4px solid #2b2d42;
      border-radius: 16px;
      font-size: 18px;
      background-color: #fff8e7;
      outline: none;
      transition: transform 0.1s;
    }
    input[type="text"]:focus {
      transform: scale(1.02);
      border-color: var(--pink-bubble);
    }

    /* Tombol Style 3D Kartun */
    button {
      font-size: 18px;
      font-weight: 700;
      color: #2b2d42;
      background-color: var(--yellow-butter);
      border: 4px solid #2b2d42;
      border-radius: 18px;
      padding: 14px 20px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      box-shadow: 0 6px 0px #2b2d42;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0px #2b2d42;
      background-color: #ffe08a;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0px #2b2d42;
    }

    .btn-mission-1 { background-color: var(--mint-green); }
    .btn-mission-2 { background-color: var(--yellow-butter); }
    .btn-mission-3 { background-color: var(--orange-sun); color: #fff; }
    .btn-mission-4 { background-color: var(--pink-bubble); color: #fff; }

    .btn-option {
      background-color: #f0f7ff;
      text-align: left;
      justify-content: flex-start;
      font-size: 16px;
      padding: 12px 18px;
      border-radius: 14px;
    }
    .btn-option:hover {
      background-color: var(--purple-candy);
    }

    /* HUD / Papan Poin */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fdf0d5;
      border: 3px solid #2b2d42;
      padding: 10px 16px;
      border-radius: 16px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 700;
    }

    .hud-chip {
      background: white;
      padding: 6px 12px;
      border-radius: 12px;
      border: 2px solid #2b2d42;
    }

    .combo-badge {
      color: #d90429;
      font-size: 20px;
      animation: bounce 0.4s infinite alternate;
    }

    /* Kotak Bacaan (Stimulus) */
    .stimulus-box {
      background-color: #fff9e6;
      border: 4px dashed var(--orange-sun);
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      font-size: 16px;
      line-height: 1.6;
      position: relative;
    }

    .stimulus-header {
      display: inline-block;
      background-color: var(--orange-sun);
      color: white;
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    /* Feedback Box */
    .feedback-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      border: 4px solid #2b2d42;
      display: none;
      animation: popIn 0.3s ease;
    }
    .feedback-correct { background-color: var(--mint-green); }
    .feedback-wrong { background-color: #ffadad; }

    /* Dashboard Tabel Guru/Ortu */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid #2b2d42;
    }
    th, td {
      border: 1px solid #2b2d42;
      padding: 10px 8px;
      text-align: center;
      font-size: 15px;
    }
    th { background-color: var(--yellow-butter); }

    /* Animasi */
    @keyframes bounce {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="game-container">

  <!-- SCREEN 1: MENU UTAMA & PILIH MISI -->
  <div id="screen-start" class="screen active">
    <h1 class="game-title">🏰 Petualangan di Negeri Dongeng</h1>
    
    <div style="text-align: center; margin-bottom: 15px; font-size: 50px;">🦄 📚 ✨</div>

    <label for="player-name">Halo Teman Kecil! Siapa Namamu?</label>
    <input type="text" id="player-name" placeholder="Ketik namamu di sini ya...">

    <label>Pilih Misi Petualanganmu:</label>
    <button class="btn-mission-1" onclick="startGame(10, '🌱 Misi Pemula')">🌱 Misi Pemula (10 Soal)</button>
    <button class="btn-mission-2" onclick="startGame(15, '⭐ Misi Petualang')">⭐ Misi Petualang (15 Soal)</button>
    <button class="btn-mission-3" onclick="startGame(20, '🏆 Misi Hebat')">🏆 Misi Hebat (20 Soal)</button>
    <button class="btn-mission-4" onclick="startGame(25, '👑 Misi Master Dongeng')">👑 Misi Master Dongeng (25 Soal)</button>

    <div style="margin-top: 25px;">
      <button style="background-color: var(--purple-candy);" onclick="showDashboard()">👩‍🏫 Menu Guru / Orang Tua</button>
    </div>
  </div>

  <!-- SCREEN 2: GAMEPLAY -->
  <div id="screen-game" class="screen">
    <!-- HUD Poin & Progress -->
    <div class="hud">
      <span class="hud-chip" id="hud-progress">📍 Soal 1/10</span>
      <span id="hud-combo" class="combo-badge"></span>
      <span class="hud-chip" id="hud-score" style="background-color: var(--yellow-butter);">⭐ 0 Poin</span>
    </div>

    <!-- Stimulus Bacaan -->
    <div id="stimulus-container" class="stimulus-box">
      <span class="stimulus-header">📖 Baca Cerita Ini Ya!</span>
      <p id="stimulus-text" style="margin: 5px 0 0 0;"></p>
    </div>

    <!-- Pertanyaan -->
    <h3 id="question-text" style="text-align: left; font-size: 20px; margin-bottom: 15px;"></h3>

    <!-- Opsi Jawaban -->
    <div id="answers-container"></div>

    <!-- Feedback Jawaban & Pembahasan -->
    <div id="feedback-container" class="feedback-box">
      <div id="feedback-title" style="font-size: 20px; font-weight: bold; margin-bottom: 6px;"></div>
      <div id="feedback-explanation" style="font-size: 16px; line-height: 1.4;"></div>
      <button id="btn-next" style="margin-top: 14px; background-color: white;" onclick="nextQuestion()">Lanjut Petualangan ➔</button>
    </div>
  </div>

  <!-- SCREEN 3: HASIL & LENCANA -->
  <div id="screen-result" class="screen" style="text-align: center;">
    <div style="font-size: 60px; margin-bottom: 10px;">🎉 🏆 🎈</div>
    <h2>Petualangan Selesai!</h2>
    <p id="result-player" style="font-size: 22px; font-weight: bold; color: var(--pink-bubble);"></p>
    
    <div style="background: #fff8e7; border: 3px solid #2b2d42; border-radius: 20px; padding: 15px; margin: 15px 0;">
      <h1 id="result-score" style="color: var(--orange-sun); font-size: 40px; margin: 0;"></h1>
      <h3 id="result-badge" style="color: #2b2d42; font-size: 22px; margin: 10px 0 0 0;"></h3>
    </div>
    
    <p id="result-stats" style="font-size: 18px;"></p>
    <button style="background-color: var(--mint-green);" onclick="showStart()">Main Lagi Yuk! 🔄</button>
  </div>

  <!-- SCREEN 4: MENU GURU / ORANG TUA -->
  <div id="screen-dashboard" class="screen">
    <h2>📊 Laporan Belajar Siswa</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Misi</th>
          <th>Benar</th>
          <th>Nilai</th>
          <th>Lencana</th>
        </tr>
      </thead>
      <tbody id="dashboard-rows">
        <!-- Hasil Belajar Otomatis Muncul di Sini -->
      </tbody>
    </table>
    <button style="margin-top: 20px; background-color: var(--sky-blue);" onclick="showStart()">⬅️ Kembali ke Game</button>
  </div>

</div>

<script>
  // BANK SOAL DENGAN VARIASI JENIS
  const questionBank = [
    {
      type: "pg",
      stimulus: "Kancil menemukan tempayan berisi sedikit air. Ia memasukkan kerikil satu per satu hingga permukaan air naik.",
      question: "Apa masalah utama yang dihadapi Kancil?",
      options: [
        "🔵 Kancil tidak menemukan makanan",
        "🟢 Kancil tidak dapat menjangkau air di dasar tempayan",
        "🟡 Kancil kehilangan kerikilnya",
        "🔴 Kancil tersesat di dalam hutan"
      ],
      answer: 1,
      explanation: "Kancil kesulitan menjangkau air karena air berada di dasar tempayan yang dalam."
    },
    {
      type: "pg",
      stimulus: "Cici Kelinci selalu membagi hasil panen wortelnya kepada tetangga yang membutuhkan, meskipun sisa untuk dirinya menjadi sedikit.",
      question: "Bagaimanakah sifat Cici Kelinci?",
      options: ["🔵 Pemaaf", "🟢 Dermawan dan Peduli", "🟡 Pemberani", "🔴 Penakut"],
      answer: 1,
      explanation: "Cici Kelinci sangat dermawan dan peduli karena suka berbagi makanan kepada teman-temannya."
    },
    {
      type: "tf",
      stimulus: "Serigala berpura-pura menjadi nenek Domba agar bisa masuk rumah. Namun suaranya yang serak membuat Domba curiga.",
      question: "Benar atau Salah: Domba langsung percaya bahwa itu adalah neneknya.",
      options: ["✅ BENAR", "❌ SALAH"],
      answer: 1,
      explanation: "Salah! Domba tidak langsung percaya karena ia curiga mendengar suara serigala yang serak."
    },
    {
      type: "pg",
      stimulus: "Kura-kura terus berjalan dengan sabar tanpa berhenti, hingga akhirnya ia berhasil melewati Kelinci yang tertidur lelap di tengah perlombaan.",
      question: "Apa pesan moral (amanat) yang bisa kita petik?",
      options: [
        "🔵 Tidak boleh berlari cepat",
        "🟢 Ketekunan dan kesabaran akan membawa keberhasilan",
        "🟡 Tidur siang itu sangat penting",
        "🔴 Kelinci adalah hewan tercepat"
      ],
      answer: 1,
      explanation: "Pesan moralnya: Usaha keras dan pantang menyerah akan membuahkan hasil yang manis!"
    },
    {
      type: "short",
      stimulus: "Di tengah Hutan Amarta yang lebat, burung-burung berkicau riang menyambut terbitnya matahari.",
      question: "Di manakah latar tempat terjadinya cerita di atas?",
      answer: "Hutan Amarta",
      explanation: "Latar tempat cerita tersebut dijelaskan langsung yaitu di 'Hutan Amarta'."
    }
  ];

  // Game Logic Variables
  let currentPlayer = "";
  let selectedMission = "";
  let activeQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let combo = 0;
  let correctCount = 0;
  let totalTarget = 0;
  let learningLogs = [];

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function showStart() { showScreen('screen-start'); }

  function startGame(questionCount, missionName) {
    const nameInput = document.getElementById('player-name').value.trim();
    if (!nameInput) {
      alert("Isi namamu dulu ya, Petualang Cilik! 😊");
      return;
    }

    currentPlayer = nameInput;
    selectedMission = missionName;
    totalTarget = Math.min(questionCount, questionBank.length);
    
    // Acak Soal
    let shuffled = [...questionBank].sort(() => 0.5 - Math.random());
    activeQuestions = shuffled.slice(0, totalTarget);

    currentIndex = 0;
    score = 0;
    combo = 0;
    correctCount = 0;

    showScreen('screen-game');
    renderQuestion();
  }

  function renderQuestion() {
    document.getElementById('feedback-container').style.display = 'none';
    const q = activeQuestions[currentIndex];

    // Update HUD
    document.getElementById('hud-progress').innerText = `📍 Soal ${currentIndex + 1}/${totalTarget}`;
    document.getElementById('hud-score').innerText = `⭐ ${score} Poin`;
    document.getElementById('hud-combo').innerText = combo >= 3 ? `🔥 Combo x${combo}!` : '';

    // Render Stimulus & Soal
    document.getElementById('stimulus-text').innerText = q.stimulus;
    document.getElementById('question-text').innerText = q.question;

    const container = document.getElementById('answers-container');
    container.innerHTML = '';

    if (q.type === 'pg' || q.type === 'tf') {
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
      });
    } else if (q.type === 'short') {
      const input = document.createElement('input');
      input.type = 'text';
      input.id = 'short-answer';
      input.placeholder = 'Ketik jawabanmu di sini...';
      
      const submitBtn = document.createElement('button');
      submitBtn.innerText = 'Kirim Jawaban 🚀';
      submitBtn.style.backgroundColor = 'var(--orange-sun)';
      submitBtn.style.color = 'white';
      submitBtn.onclick = () => checkAnswer(document.getElementById('short-answer').value);
      
      container.appendChild(input);
      container.appendChild(submitBtn);
    }
  }

  function checkAnswer(userAns) {
    const q = activeQuestions[currentIndex];
    let isCorrect = false;

    if (q.type === 'pg' || q.type === 'tf') {
      isCorrect = (userAns === q.answer);
    } else if (q.type === 'short') {
      isCorrect = (userAns.trim().toLowerCase() === q.answer.toLowerCase());
    }

    const feedbackBox = document.getElementById('feedback-container');
    const feedbackTitle = document.getElementById('feedback-title');
    const feedbackExp = document.getElementById('feedback-explanation');
    
    // Nonaktifkan tombol agar tidak bisa diklik ulang
    document.querySelectorAll('#answers-container button, #answers-container input').forEach(el => el.disabled = true);

    if (isCorrect) {
      combo++;
      correctCount++;
      let gainedScore = 10 + (combo >= 3 ? 5 : 0);
      score += gainedScore;

      feedbackBox.className = 'feedback-box feedback-correct';
      feedbackTitle.innerText = `🎉 Yey, Benar! (+${gainedScore} ⭐)`;
    } else {
      combo = 0;
      feedbackBox.className = 'feedback-box feedback-wrong';
      feedbackTitle.innerText = `💡 Yuk Pelajari Dulu!`;
    }

    feedbackExp.innerText = q.explanation;
    feedbackBox.style.display = 'block';

    document.getElementById('hud-score').innerText = `⭐ ${score} Poin`;
    document.getElementById('hud-combo').innerText = combo >= 3 ? `🔥 Combo x${combo}!` : '';
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < totalTarget) {
      renderQuestion();
    } else {
      finishGame();
    }
  }

  function finishGame() {
    showScreen('screen-result');
    const finalScore = Math.round((correctCount / totalTarget) * 100);
    let badge = "";

    if (finalScore >= 90) badge = "👑 Master Dongeng";
    else if (finalScore >= 75) badge = "🥇 Ahli Unsur Dongeng";
    else if (finalScore >= 60) badge = "🥈 Penyelidik Cerita";
    else badge = "🥉 Pembaca Dongeng";

    document.getElementById('result-player').innerText = `Hebat Sekali, ${currentPlayer}!`;
    document.getElementById('result-score').innerText = `Nilai: ${finalScore}`;
    document.getElementById('result-badge').innerText = `Lencana: ${badge}`;
    document.getElementById('result-stats').innerText = `Kamu berhasil menjawab benar ${correctCount} dari ${totalTarget} soal! Total poinmu ${score} ⭐`;

    // Rekap untuk Guru/Orang Tua
    learningLogs.push({
      name: currentPlayer,
      mission: selectedMission,
      scoreText: `${correctCount}/${totalTarget}`,
      grade: finalScore,
      badge: badge
    });
  }

  function showDashboard() {
    showScreen('screen-dashboard');
    const tbody = document.getElementById('dashboard-rows');
    tbody.innerHTML = '';

    if (learningLogs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5">Belum ada anak yang bermain.</td></tr>';
      return;
    }

    learningLogs.forEach(log => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${log.name}</strong></td>
        <td>${log.mission}</td>
        <td>${log.scoreText}</td>
        <td><strong>${log.grade}</strong></td>
        <td>${log.badge}</td>
      `;
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
